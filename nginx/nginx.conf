user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Maximum simultaneous connections per worker process
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations for file transfer and TCP packet efficiency
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Hide Nginx version from response headers (Security through obscurity)
    server_tokens off;

    # Enriched audit log format capturing security, geo, TLS and latency dimensions
    log_format audit_log '$remote_addr - [$time_local] "$request" '
                         'status=$status bytes=$body_bytes_sent '
                         'rt=$request_time urt="$upstream_response_time" '
                         'ssl="$ssl_protocol/$ssl_cipher" '
                         'country="$http_x_country_code" '
                         'ua="$http_user_agent"';

    # Direct access logs to stdout using the audit format
    access_log /var/log/nginx/access.log audit_log;

    # Include modular virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
