# ==============================================================================
# Upstream Microservice Pools
# Docker's embedded DNS automatically resolves container names on the bridge network
# ==============================================================================
upstream chat_backend {
    server chat-service:8000;
    keepalive 32; # Reuses TCP connections between Nginx and Flask backend
}

upstream ai_backend {
    server ai-service:8000;
    keepalive 32;
}

# ==============================================================================
# Rate Limiting Zones (Defense against DoS and API abuse)
# ==============================================================================
# chat_limit: 10 requests per second per IP (10MB state zone holds ~160,000 IPs)
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;

# ai_limit: 5 requests per second per IP (protects LLM upstream quotas)
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

# Return HTTP 429 instead of default 503 when limit is exceeded
limit_req_status 429;

# ==============================================================================
# Access Control: Geo-blocking Simulation & IP Blacklist
# ==============================================================================
# Maps incoming X-Country-Code header to simulate geographic compliance filtering
map $http_x_country_code $is_blocked_country {
    default 0;
    "KP" 1;        # North Korea (sanctioned simulation)
    "RU" 1;        # Russia (sanctioned simulation)
    "IR" 1;        # Iran (sanctioned simulation)
    "BLOCKED" 1;   # Deterministic test token for verification suite
}

# IP Blacklist for malicious origins
geo $remote_addr $is_blocked_ip {
    default 0;
    198.51.100.1 1;  # TEST-NET-2 malicious simulation
    203.0.113.1 1;   # TEST-NET-3 malicious simulation
}

# Header flag for local testing of IP restriction rules
map $http_x_simulate_blocked_ip $is_simulated_blocked_ip {
    default 0;
    "1" 1;
    "true" 1;
}

# Unified perimeter access control flag (excludes internal error handler)
map "$is_blocked_country:$is_blocked_ip:$is_simulated_blocked_ip:$uri" $deny_access {
    default 0;
    "~:/error_403$" 0;
    "~^1:" 1;
    "~^0:1:" 1;
    "~^0:0:1:" 1;
}

# ==============================================================================
# HTTP Listener (Port 80) - Enforce HTTPS Redirection
# ==============================================================================
server {
    listen 80;
    server_name localhost;

    # Immediate 301 Permanent Redirect to HTTPS preserving host and URI
    return 301 https://$host$request_uri;
}

# ==============================================================================
# HTTPS Listener (Port 443) - SSL Termination, Security Policies & Routing
# ==============================================================================
server {
    listen 443 ssl;
    server_name localhost;

    # SSL/TLS Certificate & Private Key
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Cryptographic hardening: modern protocols only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    # Client payload size restriction (prevents body buffer overflow attacks)
    client_max_body_size 5M;

    # Security Headers (OWASP recommendations)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Custom JSON error responses for security violations
    error_page 403 /error_403;
    location = /error_403 {
        internal;
        default_type application/json;
        return 403 '{"error":"Forbidden","code":403,"message":"Access denied by Reverse Proxy security policy (GeoIP or IP blacklist)"}';
    }

    error_page 429 /error_429;
    location = /error_429 {
        internal;
        default_type application/json;
        return 429 '{"error":"Too Many Requests","code":429,"message":"Rate limit exceeded on Reverse Proxy"}';
    }

    # Centralized perimeter access control (GeoIP & IP blacklist)
    if ($deny_access) {
        return 403;
    }

    # Gateway Landing Endpoint (Status & Available Routes)
    location = / {
        default_type application/json;
        return 200 '{"status":"active","gateway":"Nginx Reverse Proxy","endpoints":["/api/chat/","/api/ai/"],"security":{"rate_limiting":true,"geo_blocking":true,"tls":"TLSv1.2/TLSv1.3"}}';
    }

    # Trailing slash redirects for clean API root navigation
    location = /api/chat {
        return 301 /api/chat/;
    }
    location = /api/ai {
        return 301 /api/ai/;
    }

    # --------------------------------------------------------------------------
    # Route 1a: Chat WebSocket (Real-time message streaming via WSS -> WS)
    # --------------------------------------------------------------------------
    location /api/chat/ws/ {
        limit_req zone=chat_limit burst=20 nodelay;

        proxy_pass http://chat_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # Route 1: Chat Microservice (SQLite Relational Store)
    # --------------------------------------------------------------------------
    location /api/chat/ {
        # Apply Rate Limiting: 10r/s with burst allowance of 20
        limit_req zone=chat_limit burst=20 nodelay;

        # Reverse proxy pass (trailing slash strips '/api/chat/' prefix)
        proxy_pass http://chat_backend/;

        # Forward audit and origin headers to upstream Flask app
        include /etc/nginx/conf.d/proxy_headers.inc;

        # Upstream HTTP/1.1 keepalive connection reuse
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # Route 2: AI Completion Microservice (Groq / OpenRouter)
    # --------------------------------------------------------------------------
    location /api/ai/ {
        # Apply Rate Limiting: 5r/s with burst allowance of 10
        limit_req zone=ai_limit burst=10 nodelay;

        proxy_pass http://ai_backend/;

        # Forward audit and origin headers
        include /etc/nginx/conf.d/proxy_headers.inc;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Extended timeouts for LLM API roundtrips
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
