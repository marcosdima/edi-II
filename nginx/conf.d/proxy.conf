# Define upstream groups pointing to internal Docker container hostnames
# Docker's embedded DNS resolves 'chat-service' and 'ai-service' automatically
upstream chat_backend {
    server chat-service:8000;
    keepalive 32; # Keeps TCP connections alive between Nginx and the Python backend
}

upstream ai_backend {
    server ai-service:8000;
    keepalive 32;
}

# HTTP (Port 80): Insecure plain-text listener
# Enforces an immediate 301 Permanent Redirect to HTTPS
server {
    listen 80;
    server_name localhost;

    # $host maintains requested domain; $request_uri maintains full path and query params
    return 301 https://$host$request_uri;
}

# HTTPS (Port 443): Secure TLS termination and Reverse Proxy
server {
    listen 443 ssl;
    server_name localhost;

    # SSL/TLS Certificate & Private Key paths
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Modern TLS protocol security: Disable deprecated SSLv3, TLS 1.0, and TLS 1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    # Client payload size restriction (prevents DoS via huge request bodies)
    client_max_body_size 5M;

    # Default Gateway Landing (Status overview)
    location = / {
        default_type application/json;
        return 200 '{"status":"active","gateway":"Nginx Reverse Proxy","endpoints":["/api/chat/","/api/ai/"]}';
    }

    # Redirect naked paths to their trailing-slash counterparts
    location = /api/chat {
        return 301 /api/chat/;
    }
    location = /api/ai {
        return 301 /api/ai/;
    }

    # -----------------------------------------------------------
    # Microservice 1: Chat Application (SQLite backend)
    # -----------------------------------------------------------
    location /api/chat/ {
        # Trailing slash on proxy_pass strips the '/api/chat/' prefix:
        # e.g., https://localhost/api/chat/conversations -> http://chat_backend/conversations
        proxy_pass http://chat_backend/;

        # Essential Reverse Proxy headers forwarded to Flask:
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade HTTP version for upstream keepalive support
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # -----------------------------------------------------------
    # Microservice 2: AI Completion Service (Groq / OpenRouter)
    # -----------------------------------------------------------
    location /api/ai/ {
        # Trailing slash strips '/api/ai/' prefix:
        # e.g., https://localhost/api/ai/generate -> http://ai_backend/generate
        proxy_pass http://ai_backend/;

        # Reverse Proxy headers forwarded to Flask:
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Extended timeout: External LLM requests may take several seconds to stream/complete
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
