[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["database", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/chat_service"]

[tool.pyright]
include = ["services", "tests"]
extraPaths = ["services/chat_service"]

